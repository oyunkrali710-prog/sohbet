<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
body{font-family:sans-serif;margin:0;background:#111;color:#eee;display:flex;flex-direction:column;height:100vh}
h3{margin:0;padding:12px 12px 6px;background:#222;text-align:center;font-size:17px}
#who{display:flex;align-items:center;justify-content:center;gap:6px;background:#222;padding:0 12px 10px;font-size:13px;color:#aaa}
#meName{color:#7ec8ff;font-weight:600}
#editName{background:none;border:1px solid #555;color:#aaa;border-radius:6px;padding:2px 8px;font-size:12px;cursor:pointer}
#users{display:flex;gap:8px;overflow-x:auto;background:#1a1a1a;padding:8px 10px;border-bottom:1px solid #2a2a2a}
.u{display:flex;align-items:center;gap:5px;background:#242424;padding:5px 10px;border-radius:14px;font-size:12px;white-space:nowrap;flex-shrink:0}
.dot{width:8px;height:8px;border-radius:50%;background:#555}
.dot.on{background:#2ecc71;box-shadow:0 0 5px #2ecc71}
#log{flex:1;overflow-y:auto;padding:10px}
.m{max-width:75%;padding:8px 12px;margin:6px 0;border-radius:14px;font-size:16px;clear:both}
.d{background:#2a6;float:left}.p{background:#37f;float:right}
.who2{font-size:11px;opacity:.7;display:block;margin-bottom:2px}
#bar{display:flex;padding:8px;background:#222;gap:6px}
#t{flex:1;font-size:16px;padding:10px;border-radius:8px;border:0}
button{font-size:16px;padding:10px 16px;border:0;border-radius:8px;background:#37f;color:#fff}
</style>

<body>
<h3>ESP32 Sohbet</h3>
<div id="who">
  Sen: <span id="meName">-</span>
  <button id="editName">değiştir</button>
</div>
<div id="users"></div>
<div id="log"></div>
<div id="bar">
  <input id="t" placeholder="Mesaj yaz...">
  <button onclick="snd()">Gönder</button>
</div>

<script>
const FIREBASE_HOST = "https://haberlesme-e266c-default-rtdb.firebaseio.com";
const ONLINE_LIMIT = 12000;

let ME = localStorage.getItem('sohbet_name');
if (!ME) { ME = prompt("Adını yaz:", "Ben") || "Ben"; localStorage.setItem('sohbet_name', ME); }
document.getElementById('meName').textContent = ME;

document.getElementById('editName').onclick = () => {
  const n = prompt("Yeni adın:", ME);
  if (n && n.trim()) { ME = n.trim(); localStorage.setItem('sohbet_name', ME); document.getElementById('meName').textContent = ME; }
};

const L = document.getElementById('log'), T = document.getElementById('t'), U = document.getElementById('users');

function timeAgo(ms) {
  const s = Math.floor((Date.now() - ms) / 1000);
  if (s < 60) return "az önce";
  const m = Math.floor(s / 60);
  if (m < 60) return m + " dk önce";
  return Math.floor(m / 60) + " sa önce";
}

async function heartbeat() {
  try {
    await fetch(FIREBASE_HOST + '/presence/' + encodeURIComponent(ME) + '.json', {
      method: 'PUT', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ time: { ".sv": "timestamp" } })
    });
  } catch (e) {}
}

async function pollUsers() {
  try {
    const r = await fetch(FIREBASE_HOST + '/presence.json');
    const data = await r.json();
    U.innerHTML = '';
    if (data) {
      Object.keys(data).sort().forEach(name => {
        const t = data[name].time || 0;
        const online = (Date.now() - t) < ONLINE_LIMIT;
        const el = document.createElement('div');
        el.className = 'u';
        el.innerHTML = '<span class="dot ' + (online ? 'on' : '') + '"></span>' + name + (online ? '' : ' · ' + timeAgo(t));
        U.appendChild(el);
      });
    }
  } catch (e) {}
  setTimeout(pollUsers, 4000);
}

async function pollMessages() {
  try {
    const url = FIREBASE_HOST + '/messages.json?orderBy="$key"&limitToLast=30';
    const r = await fetch(url);
    const data = await r.json();
    if (data) {
      const keys = Object.keys(data).sort();
      L.innerHTML = '';
      keys.forEach(k => {
        const m = data[k];
        const d = document.createElement('div');
        const mine = m.from === ME;
        d.className = 'm ' + (mine ? 'p' : 'd');
        d.innerHTML = '<span class="who2">' + m.from + '</span>' + m.text;
        L.appendChild(d);
      });
      L.scrollTop = L.scrollHeight;
    }
  } catch (e) {}
  setTimeout(pollMessages, 1500);
}

async function snd() {
  const v = T.value.trim();
  if (!v) return;
  T.value = '';
  await fetch(FIREBASE_HOST + '/messages.json', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ from: ME, text: v, time: Date.now() })
  });
}
T.addEventListener('keydown', e => { if (e.key === 'Enter') snd(); });

heartbeat();
setInterval(heartbeat, 5000);
pollUsers();
pollMessages();
