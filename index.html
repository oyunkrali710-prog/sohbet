<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
body{font-family:sans-serif;margin:0;background:#111;color:#eee;height:100vh;overflow:hidden}
.screen{display:none;flex-direction:column;height:100%}
.screen.active{display:flex}
h3{margin:0;padding:12px;background:#222;text-align:center;font-size:17px;display:flex;align-items:center;justify-content:space-between}
#backBtn{background:none;border:0;color:#7ec8ff;font-size:16px;cursor:pointer}
#who{display:flex;align-items:center;justify-content:center;gap:6px;background:#1a1a1a;padding:6px 12px;font-size:13px;color:#aaa}
#meName{color:#7ec8ff;font-weight:600}
#editName{background:none;border:1px solid #555;color:#aaa;border-radius:6px;padding:2px 8px;font-size:12px;cursor:pointer}
#addBtn{background:#37f;border:0;color:#fff;border-radius:8px;padding:6px 14px;font-size:14px;cursor:pointer}
#contactList{flex:1;overflow-y:auto}
.contact{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid #222;cursor:pointer}
.contact:active{background:#1c1c1c}
.avatar{width:44px;height:44px;border-radius:50%;background:#37f;display:flex;align-items:center;justify-content:center;font-weight:bold;flex-shrink:0;font-size:18px}
.cinfo{flex:1;min-width:0}
.crow{display:flex;justify-content:space-between;align-items:baseline}
.cname{font-size:16px}
.ctime{font-size:11px;color:#777}
.cpreview{font-size:13px;color:#888;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;align-items:center;gap:4px}
.dot{width:8px;height:8px;border-radius:50%;background:#555;flex-shrink:0}
.dot.on{background:#2ecc71;box-shadow:0 0 5px #2ecc71}
#empty{padding:40px 20px;text-align:center;color:#666;font-size:14px}
#log{flex:1;overflow-y:auto;padding:10px}
.m{max-width:75%;padding:8px 12px;margin:6px 0;border-radius:14px;font-size:16px;clear:both}
.d{background:#2a6;float:left}.p{background:#37f;float:right}
.mtime{font-size:10px;opacity:.65;display:block;text-align:right;margin-top:2px}
#bar{display:flex;padding:8px;background:#222;gap:6px}
#t{flex:1;font-size:16px;padding:10px;border-radius:8px;border:0}
button.send{font-size:16px;padding:10px 16px;border:0;border-radius:8px;background:#37f;color:#fff}
</style>
</head>
<body>

<div class="screen active" id="screenList">
  <h3>Sohbetler <button id="addBtn">+ Kişi</button></h3>
  <div id="who">
    Sen: <span id="meName">-</span>
    <button id="editName">değiştir</button>
  </div>
  <div id="contactList"></div>
</div>

<div class="screen" id="screenChat">
  <h3><button id="backBtn">←</button> <span id="chatTitle">-</span> <span style="width:24px"></span></h3>
  <div id="log"></div>
  <div id="bar">
    <input id="t" placeholder="Mesaj yaz...">
    <button class="send" onclick="snd()">Gönder</button>
  </div>
</div>

<script>
const FIREBASE_HOST = "https://haberlesme-e266c-default-rtdb.firebaseio.com";
const ONLINE_LIMIT = 12000;

let ME = localStorage.getItem('sohbet_name');
if (!ME) { ME = prompt("Adını yaz:", "Ben") || "Ben"; localStorage.setItem('sohbet_name', ME); }
document.getElementById('meName').textContent = ME;

let contacts = [];
let presenceData = {};
let previews = {};
let currentChat = null;

document.getElementById('editName').onclick = () => {
  const n = prompt("Yeni adın:", ME);
  if (n && n.trim()) { ME = n.trim(); localStorage.setItem('sohbet_name', ME); document.getElementById('meName').textContent = ME; refreshContacts(); }
};

document.getElementById('addBtn').onclick = async () => {
  const n = prompt("Eklenecek kişinin adı (cihazdaki/sitedeki adıyla AYNI olmalı):");
  if (!n || !n.trim() || n.trim() === ME) return;
  const name = n.trim();
  await Promise.all([
    fetch(`${FIREBASE_HOST}/contacts/${encodeURIComponent(ME)}/${encodeURIComponent(name)}.json`, { method: 'PUT', body: 'true' }),
    fetch(`${FIREBASE_HOST}/contacts/${encodeURIComponent(name)}/${encodeURIComponent(ME)}.json`, { method: 'PUT', body: 'true' })
  ]);
  refreshContacts();
};

document.getElementById('backBtn').onclick = () => {
  currentChat = null;
  document.getElementById('screenChat').classList.remove('active');
  document.getElementById('screenList').classList.add('active');
  refreshContacts();
};

function pairKey(a, b) {
  const clean = s => s.replace(/[.#$/\[\]]/g, '_');
  const arr = [clean(a), clean(b)].sort();
  return arr[0] + '__' + arr[1];
}

function timeAgo(ms) {
  const s = Math.floor((Date.now() - ms) / 1000);
  if (s < 60) return "az önce";
  const m = Math.floor(s / 60);
  if (m < 60) return m + " dk önce";
  return Math.floor(m / 60) + " sa önce";
}
function shortTime(ms) {
  const d = new Date(ms);
  return d.getHours().toString().padStart(2, '0') + ':' + d.getMinutes().toString().padStart(2, '0');
}

async function refreshContacts() {
  try {
    const r = await fetch(`${FIREBASE_HOST}/contacts/${encodeURIComponent(ME)}.json`);
    const data = await r.json();
    contacts = data ? Object.keys(data) : [];
  } catch (e) { contacts = []; }
  await loadPreviews();
  renderContacts();
}

async function loadPreviews() {
  await Promise.all(contacts.map(async name => {
    try {
      const url = `${FIREBASE_HOST}/messages/${pairKey(ME, name)}.json?orderBy="$key"&limitToLast=1`;
      const r = await fetch(url);
      const data = await r.json();
      if (data) {
        const k = Object.keys(data)[0];
        previews[name] = data[k];
      }
    } catch (e) {}
  }));
}

function renderContacts() {
  const L = document.getElementById('contactList');
  if (contacts.length === 0) { L.innerHTML = '<div id="empty">Henüz kişi yok. "+ Kişi" ile ekle.</div>'; return; }
  const sorted = [...contacts].sort((a, b) => (previews[b]?.time || 0) - (previews[a]?.time || 0));
  L.innerHTML = '';
  sorted.forEach(name => {
    const p = presenceData[name];
    const online = p && (Date.now() - p.time) < ONLINE_LIMIT;
    const prev = previews[name];
    const div = document.createElement('div');
    div.className = 'contact';
    div.innerHTML = `
      <div class="avatar">${name.charAt(0).toUpperCase()}</div>
      <div class="cinfo">
        <div class="crow"><span class="cname">${name}</span><span class="ctime">${prev ? shortTime(prev.time) : ''}</span></div>
        <div class="cpreview"><span class="dot ${online ? 'on' : ''}"></span>${prev ? (prev.from === ME ? 'Sen: ' : '') + prev.text : (online ? 'çevrimiçi' : 'henüz mesaj yok')}</div>
      </div>`;
    div.onclick = () => openChat(name);
    L.appendChild(div);
  });
}

function openChat(name) {
  currentChat = name;
  document.getElementById('chatTitle').textContent = name;
  document.getElementById('screenList').classList.remove('active');
  document.getElementById('screenChat').classList.add('active');
  document.getElementById('log').innerHTML = '';
  pollMessages();
}

async function pollPresence() {
  try {
    const r = await fetch(FIREBASE_HOST + '/presence.json');
    presenceData = await r.json() || {};
    if (document.getElementById('screenList').classList.contains('active')) renderContacts();
  } catch (e) {}
  setTimeout(pollPresence, 4000);
}

async function pollContactsLoop() {
  if (document.getElementById('screenList').classList.contains('active')) await refreshContacts();
  setTimeout(pollContactsLoop, 8000);
}

async function heartbeat() {
  try {
    await fetch(FIREBASE_HOST + '/presence/' + encodeURIComponent(ME) + '.json', {
      method: 'PUT', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ time: { ".sv": "timestamp" } })
    });
  } catch (e) {}
}

async function pollMessages() {
  if (!currentChat) return;
  try {
    const url = FIREBASE_HOST + '/messages/' + pairKey(ME, currentChat) + '.json?orderBy="$key"&limitToLast=50';
    const r = await fetch(url);
    const data = await r.json();
    const L = document.getElementById('log');
    L.innerHTML = '';
    if (data) {
      Object.keys(data).sort().forEach(k => {
        const m = data[k];
        const d = document.createElement('div');
        d.className = 'm ' + (m.from === ME ? 'p' : 'd');
        d.innerHTML = m.text.replace(/</g, '&lt;') + '<span class="mtime">' + shortTime(m.time) + '</span>';
        L.appendChild(d);
      });
      L.scrollTop = L.scrollHeight;
    }
  } catch (e) {}
  setTimeout(pollMessages, 1500);
}

async function snd() {
  const t = document.getElementById('t');
  const v = t.value.trim();
  if (!v || !currentChat) return;
  t.value = '';
  await fetch(FIREBASE_HOST + '/messages/' + pairKey(ME, currentChat) + '.json', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ from: ME, text: v, time: Date.now() })
  });
}
document.getElementById('t').addEventListener('keydown', e => { if (e.key === 'Enter') snd(); });

async function ensureDeviceContact() {
  try {
    await Promise.all([
      fetch(`${FIREBASE_HOST}/contacts/${encodeURIComponent(ME)}/Cihaz1.json`, { method: 'PUT', body: 'true' }),
      fetch(`${FIREBASE_HOST}/contacts/Cihaz1/${encodeURIComponent(ME)}.json`, { method: 'PUT', body: 'true' })
    ]);
  } catch (e) {}
}

ensureDeviceContact().then(refreshContacts);
heartbeat();
setInterval(heartbeat, 5000);
