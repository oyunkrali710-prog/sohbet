<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ESP32 Sohbet</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#222222">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sohbet">
<style>
body{font-family:sans-serif;margin:0;background:#111;color:#eee;display:flex;flex-direction:column;height:100vh}
h3{margin:0;padding:12px;background:#222;text-align:center}
#log{flex:1;overflow-y:auto;padding:10px}
.m{max-width:75%;padding:8px 12px;margin:6px 0;border-radius:14px;font-size:18px;clear:both}
.d{background:#2a6;float:left}.p{background:#37f;float:right}
.who{font-size:11px;opacity:.7;display:block;margin-bottom:2px}
#bar{display:flex;padding:8px;background:#222;gap:6px}
#t{flex:1;font-size:18px;padding:8px;border-radius:8px;border:0}
#n{width:90px;font-size:14px;padding:8px;border-radius:8px;border:0;margin-right:4px}
button{font-size:18px;padding:8px 14px;border:0;border-radius:8px;background:#37f;color:#fff}
</style>
</head>
<body>
<h3>ESP32 Sohbet</h3>
<div id="log"></div>
<div id="bar">
  <input id="n" placeholder="Adın" value="Telefon">
  <input id="t" placeholder="Mesaj yaz...">
  <button onclick="snd()">Gönder</button>
</div>
<script>
const FIREBASE_HOST = "https://haberlesme-e266c-default-rtdb.firebaseio.com";
let lastKey = null;
const L = document.getElementById('log'), T = document.getElementById('t'), N = document.getElementById('n');

async function poll() {
  try {
    const url = FIREBASE_HOST + '/messages.json?orderBy="$key"&limitToLast=30';
    const r = await fetch(url);
    const data = await r.json();
    if (data) {
      const keys = Object.keys(data).sort();
      L.innerHTML = '';
      keys.forEach(k => {
        const m = data[k];
        const d = document.createElement('div');
        const mine = m.from === N.value;
        d.className = 'm ' + (mine ? 'p' : 'd');
        d.innerHTML = '<span class="who">' + m.from + '</span>' + m.text;
        L.appendChild(d);
      });
      L.scrollTop = L.scrollHeight;
    }
  } catch (e) { console.log(e); }
  setTimeout(poll, 1500);
}

async function snd() {
  const v = T.value.trim();
  if (!v) return;
  T.value = '';
  await fetch(FIREBASE_HOST + '/messages.json', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ from: N.value || 'Telefon', text: v, time: Date.now() })
  });
}
T.addEventListener('keydown', e => { if (e.key === 'Enter') snd(); });
poll();

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
</body>
</html>
